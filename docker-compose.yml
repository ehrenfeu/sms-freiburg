services:
  selenium:
    image: selenium/standalone-chromium:155.0@sha256:ba9dde71436cd1ffdae5ec783d0786742208b13211857e9ab52a4f695ba28e2b
    shm_size: 2gb
    restart: no
    environment:
      SE_NODE_MAX_SESSIONS: "1"

  scraper:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim-bookworm

        RUN apt-get update \
            && apt-get install -y --no-install-recommends git \
            && rm -rf /var/lib/apt/lists/*

        COPY --from=ghcr.io/astral-sh/uv:0.8.15 /uv /uvx /bin/

        WORKDIR /app
        COPY .git/ .git/
        COPY pyproject.toml README.md ./
        COPY sms_freiburg/ ./sms_freiburg/

        RUN uv sync --no-dev

        CMD ["uv", "run", "sms-freiburg", "-vv"]
    restart: no
    init: true
    depends_on:
    - selenium
    environment:
      SELENIUM_REMOTE_URL: http://selenium:4444
    volumes:
    - ./config.yaml:/app/config.yaml:ro
