[project]
name = "sms-freiburg"
dynamic = ["version"]
description = "extracts information from sms-freiburg.de and shares it via MQTT"
authors = [{ name = "Gabi Röger" }]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only"

dependencies = [
    "click>=8.5.0",
    "loguru>=0.7.3",
    "paho-mqtt==2.1.0",
    "PyYAML==6.0.3",
    "selene==2.0.0rc10",
    "selenium==4.50.0",
]

[project.urls]
Issues = "https://github.com/roeger/sms-freiburg/issues"
Repository = "https://github.com/roeger/sms-freiburg"

[project.scripts]
sms-freiburg = "sms_freiburg.cli:main"


[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["sms_freiburg"]
